# BlueLine Darts on Netlify. Netlify detects Next.js and adds its Next.js runtime itself.
# Page metadata, the sitemap, robots.txt and llms.txt use the URL Netlify sets during the build.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # package.json needs Node 22.18 or newer (the tests run TypeScript directly).
  NODE_VERSION = "22"
